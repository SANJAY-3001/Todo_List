<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ToDo List</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="todo-main">
            <h2>MONDAY, JULY 27</h2>
            <h1>TODAY</h1>
            <p>2 tasks remaining</p>
            <input type="text" placeholder="Add a new task">
            <button>+ Add</button>

            <div class="navbar">
                <ul>
                    <li>All</li>
                    <li>Active</li>
                    <li>Done</li>
                </ul>
            </div>

            <ul class="tasks">
                <li class="task">
                    <input type="checkbox">
                    Task1 for the day.
                </li>
                <li class="task">
                    <input type="checkbox">
                    Task2 for the day.
                </li>
            </ul>

            <div class="line"></div>

            <p>
                2 total tasks
            </p>
            <p>0 completed</p>
        </div>

        <script src="scripts.js"></script>
    </body>
</html>
