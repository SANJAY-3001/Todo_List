<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ToDo List</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    </head>

    <body>

        <div class="todo-main">
            <p class="date-time">MONDAY, JULY 27</p>
            <h1 class="today-el">Today</h1>
            <p class="task-no">2 tasks remaining</p>

            <div class="add-task">
                <input class="task-input" type="text" placeholder="Add a new task..." id="input-el">
                <button class="btn" id="add-btn">+ Add</button>
            </div>  

            <div class="progress">
                <div class="buttons">
                    <button class="progress-btn active" id="all-btn">All</button >
                    <button class="progress-btn" id="active-btn">Active</button>
                    <button class="progress-btn" id="done-btn">Done</button>
                </div>
                <button  id="clear-el">Clear done</button>
            </div>

            <ul class="tasks" id="ul-el">
                <li class="task">
                    <input class="check-input" type="checkbox">
                    <span> Task1 for the day.</span>
                </li>
                <li class="task">
                    <input class="check-input" type="checkbox">
                    Task2 for the day.
                </li>
            </ul>

            <div class="line">
                <p>2 total tasks</p>
                <p>0 completed</p>
            </div>
        </div>

        <script src="scripts.js"></script>
    </body>
</html>
